name: Build & Release Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Optional release tag (leave blank to use app/build.gradle.kts versionName)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Determine release tag
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.tag_name }}" ]; then
            TAG="${{ inputs.tag_name }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            VER=$(grep -E 'versionName\s*=' app/build.gradle.kts | head -n1 | sed -E 's/.*"([^"]+)".*/\1/')
            if [ -z "$VER" ]; then
              VER="1.0"
            fi
            TAG="v${VER}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Build APK (Signed Release or Debug fallback)
        id: build
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_HOME" ] && [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          fi
          mkdir -p dist-apk
          TAG="${{ steps.meta.outputs.tag }}"
          if [ -n "$KEYSTORE_B64" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "Building signed Release APK..."
            echo "$KEYSTORE_B64" | base64 --decode > "${{ runner.temp }}/release-keystore.jks"
            KEYSTORE_PATH="${{ runner.temp }}/release-keystore.jks" gradle :app:assembleRelease --no-daemon --stacktrace
            APK_OUT="dist-apk/MobileRepairShop-${TAG}.apk"
            cp app/build/outputs/apk/release/app-release.apk "$APK_OUT"
            echo "mode=Signed Release APK" >> "$GITHUB_OUTPUT"
          else
            echo "Release signing secrets not configured yet; building Debug APK..."
            if [ ! -f debug.keystore ]; then
              if [ -s debug.keystore.base64 ]; then
                echo "Decoding debug.keystore from debug.keystore.base64..."
                base64 --decode debug.keystore.base64 > debug.keystore
              else
                echo "debug.keystore.base64 not found in repo; generating CI debug.keystore via keytool..."
                keytool -genkeypair -v \
                  -keystore debug.keystore \
                  -storetype PKCS12 \
                  -storepass android \
                  -alias androiddebugkey \
                  -keypass android \
                  -keyalg RSA \
                  -keysize 2048 \
                  -validity 10000 \
                  -dname "CN=Android Debug,O=Android,C=US"
              fi
            fi
            gradle :app:assembleDebug --no-daemon --stacktrace
            APK_OUT="dist-apk/MobileRepairShop-${TAG}-debug.apk"
            cp app/build/outputs/apk/debug/app-debug.apk "$APK_OUT"
            echo "mode=Debug APK (configure RELEASE_KEYSTORE_BASE64 secret for Release APK)" >> "$GITHUB_OUTPUT"
          fi
          echo "apk_path=${APK_OUT}" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MobileRepairShop-${{ steps.meta.outputs.tag }}-apk
          path: ${{ steps.build.outputs.apk_path }}
          retention-days: 30

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: "Mobile Repair Shop ${{ steps.meta.outputs.tag }}"
          body: "Automated APK build (${{ steps.build.outputs.mode }}). Download the `.apk` file under **Assets** below and install on Android."
          make_latest: true
          generate_release_notes: true
          files: ${{ steps.build.outputs.apk_path }}
